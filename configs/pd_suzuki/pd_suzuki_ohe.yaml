 'solvent_2-methyl-2-butanol',
 'solvent_EtOAc',
 'solvent_EtOH',
 'solvent_MEK',
 'solvent_MeOH',
 'solvent_MeTHF',
 'solvent_acetonitrile',
 'solvent_anisole',
 'solvent_cyclopentyl-methyl-ether',
 'solvent_di-isopropyl ether',
 'solvent_iPrOH',
 'solvent_toluene',
 'precursor_[Pd(OAc)2]',
 'precursor_[Pd(allyl)Cl]2',
 'precursor_[Pd2(dba)3]',
 'base_Cs2CO3',
